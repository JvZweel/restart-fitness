<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animation preview · Restart Fitness</title>
<style>
  :root { color-scheme: light; --bg: #f3f5f7; --stage: radial-gradient(120% 90% at 50% 30%, #ffffff 0%, #e9edf0 72%); --text: #1d2327; --muted: #5d6870; --line: #d6dce0; }
  [data-theme='dark'] { color-scheme: dark; --bg: #0f1214; --stage: radial-gradient(120% 90% at 50% 30%, #1f2529 0%, #12161a 72%); --text: #e6e9eb; --muted: #9aa5ad; --line: #2a3136; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  select, button { font: inherit; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; }
  label { display: inline-flex; gap: 6px; align-items: center; min-height: 40px; }
  canvas { width: 100%; aspect-ratio: 4 / 3; display: block; background: var(--stage); border-radius: 16px; border: 1px solid var(--line); touch-action: pan-y; }
  #phase { color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.4em; }
  body.sheet main { padding: 0; max-width: none; }
  body.sheet .bar, body.sheet #phase { display: none; }
  body.sheet canvas { width: 420px; height: 400px; aspect-ratio: auto; border: 0; border-radius: 0; }
</style></head>
<body><main>
  <div class="bar">
    <select id="pick" aria-label="Animation"></select>
    <button id="play" type="button">Pause</button>
    <label><input id="trails" type="checkbox"> Dumbbell trails</label>
    <label><input id="dark" type="checkbox"> Dark</label>
  </div>
  <canvas id="c" role="img" aria-label="Exercise animation preview. Drag to rotate."></canvas>
  <div id="phase" aria-live="off"></div>
</main><script type="module" src="/src/anim/preview.ts"></script></body></html>
